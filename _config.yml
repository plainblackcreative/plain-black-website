# Keep internal/build files off the public GitHub Pages build. The docs/ folder
# (internal strategy/spec/voice .md + its data .json) has been relocated to the
# private plainblack-admin repo, so its per-file excludes are gone. If a
# sensitive docs/*.md ever returns to this repo, add it back below per-file (a
# folder-level `exclude: [docs]` + `include:` did NOT re-expose docs/*.json when
# that was tried, so per-file is the reliable fix).
exclude:
  # Dev/repo files that must never be served on the customer domain. CLAUDE.md
  # in particular named the private plainblack-admin repo + its structure.
  # AGENTS.md was CLAUDE.md's twin (same conventions, addressed to Codex). It was
  # added to the repo without being added here and was served publicly until
  # 2026-07-15. Deleted 2026-07-20: as a hand-copied twin it had already drifted
  # (its Deployment section still described the pre-correction hosting story).
  # CLAUDE.md is now the single home for repo conventions. The exclude entry
  # below stays as a guard in case anyone re-adds the file. If you ever add a
  # third agent-instruction file, exclude it here in the same commit.
  - CLAUDE.md
  - AGENTS.md
  - README.md
  - CONTRIBUTING.md
  # Worker inventory / ownership map. Lists KV binding + secret NAMES (no values)
  # and source-repo paths — internal dev reference, don't serve on the public site.
  - WORKERS.md
  # Build-time tooling (npm run lint:chrome, repair:*, sync-tracking, etc).
  # Nothing on the site loads these at runtime: no <script src> anywhere points
  # at /scripts/. They were served publicly until 2026-07-15. Same trigger as
  # CLAUDE.md above: inject-cf-beacon.js, lint-blog-chrome.js, install-hooks.js
  # and build-pages-manifest.js all name the private plainblack-admin repo and
  # the CF-Access-gated admin host. Nothing secret (the CF Web Analytics token
  # in inject-cf-beacon.js is public by design and already in every page's
  # head), and the repo is public so this is tidiness, not secrecy. Folder-level
  # exclude is safe here: unlike the docs/ case noted above, there is no
  # `include:` trying to re-expose part of the folder. The pre-push hook still
  # runs these from the repo checkout; excluding only affects Jekyll's output.
  - scripts
  - assets/LOGO_DARK_BASE64.txt
  - assets/LOGO_LIGHT_BASE64.txt
  - assets/plainblack_asset_pack/README.md
  # Favicon/icon SOURCE package (RealFaviconGenerator-style master set). The
  # individual served files were copied out to the web root + assets/; this
  # folder is the tracked source-of-truth only and holds heavy originals
  # (1.6 MB embedded-raster SVG, source PNGs, preview sheet) — don't serve it.
  - "assets/PlainBlack Icon Favicon Set"
  # Internal build artifact: full page inventory + per-page SEO scores. Tracked
  # for the pre-push hook, but nothing on the site reads it, so don't serve it.
  - website-pages.json
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  # Playbook product sunset (2026-06-14): the generator source templates and
  # unshipped drafts under playbooks/ready + playbooks/future are no longer a
  # public product. Stop serving the raw token-placeholder files (they carry
  # [[BUSINESS_NAME]] placeholders + the api-proxy fetch). Salvaged + tagged as
  # archive/playbooks-2026-06-14; the generator reads them via the GitHub API,
  # not this public path, so excluding them does not break generation.
  - playbooks/ready
  - playbooks/future
